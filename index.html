const LR=[["Penjualan",jual],["HPP",-hpp],["LABA KOTOR",jual-hpp,1],...lain.filter(x=>x[1]).map(x=>[x[0],x[1]]),...beb.filter(x=>x[1]).map(x=>["Beban: "+x[0],-x[1]]),["LABA (RUGI) BERSIH",laba,1]];

const other=eq-laba-modal0-prive;const PM=[["Modal awal periode",modal0],["Laba (rugi) bersih",laba],["Penambahan modal / mutasi lain",other],["Prive",prive],["MODAL AKHIR",modal0+laba+other+prive,1]];
const cat=k=>k.startsWith("1-4")?"Investasi":k.startsWith("3-")||k==="2-1101"?"Pendanaan":"Operasional";const fl={Operasional:0,Investasi:0,Pendanaan:0,Transfer:0};

const AK=[...Object.entries(fl).map(([k,v])=>["Kas bersih "+k,v]),["KENAIKAN (PENURUNAN) KAS",net,1],["Saldo kas awal",k0],["SALDO KAS AKHIR",k0+net,1]];
const chk=[["Neraca seimbang (Aset = Liabilitas + Ekuitas)",Math.abs(aset-liab-eq)<.5],["Modal akhir = ekuitas neraca",Math.abs(PM[4][1]-eq)<.5],["Arus kas = saldo kas buku besar",Math.abs(k0+net-k1)<.5]];
return{LR,NR,PM,AK,chk}}
function drawLp(){if(!S.j.length)return`<div class="card">Belum ada data.</div>`;const R=reports();

async function exportXl(){const R=reports(),wb=XLSX.utils.book_new(),add=(n,a)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(a),n);
